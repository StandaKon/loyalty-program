name: Validate pull request to master

on:
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  deploy-to-scratch-and-run-tests:
    runs-on: ubuntu-latest
    environment: Production
    container:
      image: salesforce/cli:latest-slim

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authorize
        env:
          SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
        run:
          echo $SF_AUTH_URL | sf org login sfdx-url --set-default-dev-hub --sfdx-url-stdin

      - name: Create scratch org
        run: sf org create scratch --definition-file config/project-scratch-def.json --alias ScratchOrg --wait 30 --duration-days 1 --set-default --json

      - name: Install apex-mockery
        run: sf package install --skip-handlers FeatureEnforcement --package apex-mockery --target-org ScratchOrg --publish-wait 8 --wait 30

      - name: Install Apex Trigger Actions Framework
        run: sf package install --skip-handlers FeatureEnforcement --package trigger-actions-framework --target-org ScratchOrg --publish-wait 8 --wait 30

      - name: Install Enehano logger
        run: sf package install --skip-handlers FeatureEnforcement --package enehano-logger --target-org ScratchOrg --publish-wait 8 --wait 30 -k Enehano.7

      - name: Push source
        run: sf project deploy start --target-org ScratchOrg --wait 30

      - name: Run tests
        run: sf apex run test --target-org ScratchOrg --code-coverage --result-format human --output-dir ./tests/apex --test-level RunLocalTests --wait 30

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch --target-org ScratchOrg --no-prompt