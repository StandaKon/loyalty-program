<template>
    <lightning-quick-action-panel header={labels.TITLE}>
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text={labels.TITLE} size="small"></lightning-spinner>
        </template>
        <template lwc:elseif={context}>
            <div class="loyalty-summary slds-grid slds-wrap slds-m-bottom_medium">
                <div class="slds-col slds-size_1-of-2">
                    <p class="loyalty-label">{labels.TRANSACTION}</p>
                    <p class="loyalty-value">{context.transactionName}</p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <p class="loyalty-label">{labels.POINTS}</p>
                    <p class="loyalty-minus">{pointsText}</p>
                </div>
            </div>
            <template lwc:if={canReverse}>
                <p class="slds-m-bottom_small">{labels.WARNING}</p>
                <lightning-combobox
                    data-validate
                    required
                    label={labels.CATEGORY}
                    placeholder={labels.SELECT_PLACEHOLDER}
                    options={context.reasons}
                    value={reasonCode}
                    onchange={handleReasonChange}
                ></lightning-combobox>
                <lightning-textarea
                    data-validate
                    class="slds-m-top_small"
                    max-length={maxCommentLength}
                    label={labels.COMMENT_OPTIONAL}
                    value={comment}
                    onchange={handleCommentChange}
                ></lightning-textarea>
            </template>
            <template lwc:else>
                <p class="loyalty-error">{infoMessage}</p>
            </template>
        </template>
        <template lwc:if={errorMessage}>
            <p class="loyalty-error slds-m-top_small" role="alert">{errorMessage}</p>
        </template>
        <div slot="footer">
            <lightning-button label={labels.CLOSE} onclick={handleClose}></lightning-button>
            <lightning-button
                class="slds-m-left_x-small"
                variant="brand"
                label={labels.SUBMIT}
                disabled={isSubmitDisabled}
                onclick={handleSubmit}
            ></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
